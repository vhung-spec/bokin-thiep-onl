<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thiệp cưới Minh Khang &amp; Thảo Vy</title>
  <meta name="description" content="Trân trọng kính mời bạn đến chung vui trong ngày cưới của Minh Khang &amp; Thảo Vy.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Thiệp cưới Minh Khang &amp; Thảo Vy">
  <meta property="og:description" content="Trân trọng kính mời bạn đến chung vui trong ngày cưới của chúng mình.">
  <meta property="og:image" content="assets/og-image.jpg">
  <meta name="theme-color" content="#d9dccd">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 28S3 20 3 11a6.5 6.5 0 0 1 13-1 6.5 6.5 0 0 1 13 1c0 9-13 17-13 17z' fill='%235f6b30'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ephesis&family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="locked">
  <!-- Bộ lọc làm nét vẽ hơi run như vẽ tay -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <!-- ===== Bìa thiệp ===== -->
  <section class="cover" id="cover" role="button" tabindex="0" aria-label="Mở thiệp">
    <div class="cover-col">
      <span class="watermark wm-top" aria-hidden="true">wedding</span>
      <svg class="wave" id="wave" aria-hidden="true"><path id="wavePath"/></svg>
      <div class="cover-inner">
        <p class="kicker" data-text="cover.kicker"></p>
        <p class="guest" id="guest"></p>
        <h1 class="script cover-names"><span data-text="groom"></span><span class="amp">&amp;</span><span data-text="bride"></span></h1>
        <p class="cover-date" id="coverDate"></p>
      </div>
      <span class="watermark wm-bottom" aria-hidden="true">invitation</span>
      <span class="hint" data-text="cover.hint"></span>
    </div>
  </section>

  <div class="shell">
    <main>
      <!-- ===== Lời mời ===== -->
      <section class="card hero" id="loi-moi">
        <h2 class="script hero-names write" id="heroNames"></h2>
        <div class="hero-ill" id="illCouple"></div>
        <p class="lead reveal" data-text="invitation.message"></p>
        <p class="script headline write" data-text="invitation.headline"></p>
        <p class="reveal" id="whenWhere"></p>
        <a class="btn reveal" id="mapBtn" target="_blank" rel="noopener" data-text="venue.mapButton"></a>
      </section>

      <!-- ===== Chương trình ===== -->
      <section class="card schedule" id="chuong-trinh">
        <h2 class="script section-title write" data-text="schedule.title"></h2>
        <div class="banquet">
          <div id="illBanquet"></div>
          <ol class="times" id="times"></ol>
        </div>
      </section>

      <!-- ===== Dress code, quà, hoa, liên hệ, hồi âm ===== -->
      <section class="card details" id="thong-tin">
        <div id="details"></div>

        <hr class="divider">

        <div class="rsvp" id="hoi-am">
          <h2 class="script section-title write" data-text="rsvp.title"></h2>
          <p class="reveal" id="rsvpNote"></p>

          <form id="rsvpForm" class="reveal" novalidate>
            <label class="field">
              <span class="label">Tên của bạn</span>
              <input name="name" id="rsvpName" autocomplete="name" required>
            </label>

            <fieldset class="field">
              <legend class="label">Bạn sẽ đến chứ?</legend>
              <div class="choices">
                <label class="choice"><input type="radio" name="attending" value="yes" checked><span>Mình sẽ đến</span></label>
                <label class="choice"><input type="radio" name="attending" value="no"><span>Tiếc quá, mình bận</span></label>
              </div>
            </fieldset>

            <label class="field" id="guestsField">
              <span class="label">Số người</span>
              <select name="guests" id="rsvpGuests"></select>
            </label>

            <label class="field">
              <span class="label" id="msgLabel"></span>
              <textarea name="message" rows="2"></textarea>
            </label>

            <p class="form-error" id="formError" role="alert"></p>
            <button class="btn" type="submit" id="rsvpSubmit">Gửi hồi âm</button>
          </form>

          <div class="rsvp-done" id="rsvpDone" hidden>
            <p class="script done-title" id="doneTitle"></p>
            <p id="doneNote"></p>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span class="watermark wm-footer" aria-hidden="true">invitation</span>
      <p class="footer-names" id="footerNames"></p>
      <p class="footer-note" data-text="footer.note"></p>
    </footer>
  </div>

  <!-- ===== Thanh nổi: nhạc + hồi âm ===== -->
  <nav class="dock" id="dock" aria-label="Lối tắt">
    <button class="dock-music" id="musicBtn" type="button" aria-label="Bật/tắt nhạc" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
    </button>
    <a class="dock-rsvp" href="#hoi-am">Hồi âm</a>
  </nav>

  <!-- Hộp xem mã QR mừng cưới (tuỳ chọn) -->
  <dialog class="qr-dialog" id="qrDialog">
    <img id="qrImg" alt="Mã QR mừng cưới">
    <form method="dialog"><button class="btn">Đóng</button></form>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/illustrations.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
