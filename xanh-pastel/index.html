<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thiệp cưới Văn Hùng &amp; Tuyết Anh</title>
  <meta name="description" content="Trân trọng kính mời bạn tới dự lễ thành hôn của Văn Hùng &amp; Tuyết Anh, 10:30 Thứ Bảy 28.11.2026 tại Nhà văn hoá Tổ 1 Ngọc Trục.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Thiệp cưới Văn Hùng &amp; Tuyết Anh">
  <meta property="og:description" content="Trân trọng kính mời bạn tới dự lễ thành hôn của chúng mình, 10:30 Thứ Bảy 28.11.2026.">
  <meta property="og:url" content="https://vhung-spec.github.io/bokin-thiep-onl/xanh-pastel/">
  <meta property="og:image" content="https://vhung-spec.github.io/bokin-thiep-onl/xanh-pastel/assets/og-image.jpg">
  <meta name="theme-color" content="#A6A882">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 21.2s-7.6-4.7-10.1-9.4C.3 8.4 2.1 4.4 5.9 3.9c2.2-.3 4.3.9 5.3 2.7 1-1.8 3.1-3 5.3-2.7 3.8.5 5.6 4.5 3.8 7.9C19.6 16.5 12 21.2 12 21.2z' fill='%2355633F'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ephesis&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@400;500;600&family=Be+Vietnam+Pro:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="locked">

  <!-- ===== 1. BÌA: hai cánh giấy dập nổi lá, chạm dấu sáp để mở ===== -->
  <section class="gate" id="gate" aria-label="Bìa thiệp">
    <div class="doors" aria-hidden="true">
      <div class="door l"><span class="shade"></span></div>
      <div class="door r"><span class="shade"></span></div>
    </div>
    <button class="gate-open" id="gateOpen" type="button">
      <span class="gate-seal" id="gateSeal"></span>
      <span class="gate-guest" id="gateGuest" hidden></span>
      <span class="gate-hint" data-text="cover.hint"></span>
    </button>
  </section>

  <main class="shell">
    <!-- Mở đầu: hiện ra sau khi mở bìa -->
    <section class="hero sage" id="dau-trang">
      <div class="hero-seal hi" id="heroSeal"></div>
      <h1 class="hero-names">
        <span class="script name hi" id="n1"></span>
        <span class="orn hi" id="ornHeart"></span>
        <span class="script name hi" id="n2"></span>
      </h1>
      <p class="hero-date hi" id="heroDate"></p>
      <a class="scroll-hint hi" href="#loi-moi" id="scrollHint" aria-label="Xem lời mời"></a>
    </section>

    <!-- ===== 3. LỜI MỜI ===== -->
    <section class="invite sage" id="loi-moi">
      <div class="veil">
        <div class="parents rv">
          <div><p class="fam-label" id="famTraiLabel"></p><p id="famTrai"></p></div>
          <div><p class="fam-label" id="famGaiLabel"></p><p id="famGai"></p></div>
        </div>
        <p class="kicker rv" data-text="invitation.kicker"></p>
        <p class="script guest rv" id="guestName"></p>
        <p class="line rv" data-text="invitation.line"></p>
        <p class="big-names rv"><span class="script" id="bn1"></span><span class="script" id="bn2"></span></p>

        <div class="date-block rv" id="dateBlock">
          <span class="side" id="dMonth"></span>
          <b id="dDay"></b>
          <span class="side" id="dYear"></span>
        </div>
        <p class="when rv" id="whenTime"></p>
        <p class="lunar rv" id="lunar"></p>

        <div class="venue rv">
          <p class="at">Tại</p>
          <h2 class="venue-name"><span data-text="venue.name"></span></h2>
          <p class="venue-addr" data-text="venue.address"></p>
          <a class="btn-sea" id="mapBtn" target="_blank" rel="noopener"><span class="pin"></span><span data-text="venue.mapButton"></span></a>
        </div>
      </div>
    </section>

    <!-- ===== 4. ẢNH CẦU THANG + ĐẾM NGƯỢC ===== -->
    <section class="cd cream" id="dem-nguoc">
      <figure class="hero-photo">
        <img id="heroImg" alt="Văn Hùng và Tuyết Anh ngồi trên bậc cầu thang">
        <div class="tear up in-photo" data-tear="5"></div>
      </figure>
      <h2 class="script sec-title lt" data-text="countdown.title"></h2>
      <div class="cd-row rv" id="cdRow">
        <div><b data-cd="d">0</b><span>Ngày</span></div>
        <div><b data-cd="h">00</b><span>Giờ</span></div>
        <div><b data-cd="m">00</b><span>Phút</span></div>
        <div><b data-cd="s">00</b><span>Giây</span></div>
      </div>
      <p class="cd-done script" id="cdDone" hidden></p>
      <p class="script cd-sub lt" data-text="countdown.subtitle"></p>
    </section>

    <!-- Lịch tháng -->
    <section class="cal cream" id="lich">
      <h2 class="script sec-title lt" data-text="calendar.title"></h2>
      <div class="cal-card rv">
        <span class="cal-flower" data-art="sprig"></span>
        <div class="cal-head"><span class="cal-m" id="calMonth"></span><span class="cal-y" id="calYear"></span></div>
        <div class="cal-grid" id="calGrid"></div>
        <p class="cal-note" id="calNote"></p>
      </div>
      <div class="wave-end rv" data-art="garland"></div>
      <div class="tear down" data-tear="17"></div>
    </section>

    <!-- ===== 5. CÂU CHUYỆN ===== -->
    <section class="story sage" id="chuyen-tinh">
      <h2 class="script sec-title lt" data-text="loveStory.title"></h2>
      <div class="story-panel rv">
        <div id="storyText"></div>
        <p class="story-sign"><span class="closing" data-text="loveStory.closing"></span><span class="script sig" id="storySign"></span></p>
      </div>
    </section>

    <!-- Lịch trình -->
    <section class="timeline cream" id="lich-trinh">
      <div class="tear up" data-tear="23"></div>
      <h2 class="swash" data-swash="timeline.title"></h2>
      <ol class="tl rv" id="tlList"></ol>
    </section>

    <!-- Album -->
    <section class="album cream" id="album">
      <span class="fl fl-album" data-art="sprig"></span>
      <h2 class="swash" data-swash="album.title"></h2>
      <div class="car-wrap">
        <div class="carousel" id="carousel" tabindex="0" role="region" aria-label="Album ảnh cưới, vuốt ngang để xem thêm"></div>
        <button class="car-btn prev" type="button" id="carPrev" aria-label="Ảnh trước"></button>
        <button class="car-btn next" type="button" id="carNext" aria-label="Ảnh sau"></button>
      </div>
      <p class="car-count" id="carCount" aria-live="polite"></p>
    </section>

    <!-- ===== 6. XÁC NHẬN THAM DỰ ===== -->
    <section class="rsvp cream" id="xac-nhan">
      <h2 class="script sec-title lt" data-text="rsvp.title"></h2>
      <p class="sec-text rv" data-text="rsvp.text"></p>
      <form id="rsvpForm" class="paper-card rv" novalidate>
        <label class="field-label" for="rsvpName">Tên của bạn</label>
        <input class="box-input" id="rsvpName" name="name" autocomplete="name" maxlength="80" required>
        <fieldset class="field">
          <legend class="field-label">Bạn sẽ tham dự chứ?</legend>
          <div class="choices">
            <label class="choice"><input type="radio" name="attending" value="yes" id="attYes"><span data-text="rsvp.yes"></span></label>
            <label class="choice"><input type="radio" name="attending" value="no" id="attNo"><span data-text="rsvp.no"></span></label>
          </div>
        </fieldset>
        <div class="field" id="guestsField" hidden>
          <span class="field-label" id="guestsLabel" data-text="rsvp.guestsLabel"></span>
          <div class="stepper" role="group" aria-labelledby="guestsLabel">
            <button type="button" data-step="-1" aria-label="Bớt một người">−</button>
            <output id="guestCount" aria-live="polite">1</output>
            <button type="button" data-step="1" aria-label="Thêm một người">+</button>
          </div>
        </div>
        <p class="form-msg" id="rsvpMsg" role="status" aria-live="polite"></p>
        <button class="btn-ink" type="submit" id="rsvpSubmit" data-text="rsvp.button"></button>
      </form>
    </section>

    <!-- Quà mừng -->
    <section class="gift cream" id="qua-mung">
      <h2 class="script sec-title lt" data-text="gift.title"></h2>
      <p class="sec-text rv" data-text="gift.text"></p>
      <button class="gift-env rv" type="button" id="giftEnv" aria-haspopup="dialog" aria-label="Mở phong bì quà mừng">
        <span class="g-back"></span><span class="g-card"><span class="g-qr"></span></span>
        <span class="g-front"></span><span class="g-flap"></span><span class="g-seal"></span>
      </button>
      <p class="gift-tap rv">Chạm vào phong bì để mở</p>
    </section>

    <!-- Lời cảm ơn -->
    <section class="ending cream" id="cam-on">
      <figure class="end-photo">
        <div class="tear down in-photo top" data-tear="29"></div>
        <img id="endImg" alt="Văn Hùng và Tuyết Anh trên núi nhìn ra vịnh">
        <div class="tear up in-photo" data-tear="8"></div>
      </figure>
      <h2 class="swash" data-swash="thanks.title"></h2>
      <p class="sec-text thanks-text rv" data-text="thanks.text"></p>
      <p class="script end-sign rv" id="endSign"></p>
      <p class="end-date rv" id="endDate"></p>
      <div class="wave-end last rv" data-art="garland"></div>
    </section>
  </main>

  <button class="music" id="musicBtn" type="button" aria-label="Bật/tắt nhạc" hidden></button>

  <!-- Hộp quà mừng (mở khi chạm phong bì) -->
  <dialog class="dlg" id="giftDlg" aria-labelledby="giftDlgTitle">
    <button class="dlg-x" type="button" data-close aria-label="Đóng"></button>
    <p class="script dlg-title" id="giftDlgTitle" data-text="gift.title"></p>
    <div class="gift-cards" id="giftCards"></div>
    <button class="btn-outline" type="button" data-close>Đóng</button>
  </dialog>

  <!-- Xem ảnh lớn -->
  <dialog class="lightbox" id="lightbox" aria-label="Xem ảnh">
    <p class="lb-count" id="lbCount"></p>
    <img id="lbImg" alt="">
    <button class="lb-btn lb-prev" type="button" id="lbPrev" aria-label="Ảnh trước"></button>
    <button class="lb-btn lb-next" type="button" id="lbNext" aria-label="Ảnh sau"></button>
    <button class="dlg-x lb-x" type="button" data-close aria-label="Đóng"></button>
  </dialog>

  <script src="js/config.js"></script>
  <script src="../js/lunar.js"></script>
  <script src="js/art.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
