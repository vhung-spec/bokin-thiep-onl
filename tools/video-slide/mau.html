<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Mẫu video slide ảnh cưới</title>
<link rel="stylesheet" href="font/font.css">
<style>
  :root {
    --sage: #A7A680; --paper: #FFFDF8; --ink: #2D3826; --ink-2: #57614A; --gold: #B48A55; --gold-d: #87602F;
    --script: 'Ephesis', cursive; --serif: 'Lora', Georgia, serif; --title: 'Playfair Display', Georgia, serif; --ui: 'Be Vietnam Pro', sans-serif;
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; background: var(--sage); transform-origin: 0 0; }
  .scene { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
  .paper { position: absolute; background: var(--sage) url(../../xanh-pastel/assets/giay-xo-tham.webp) center / cover no-repeat; }
  .paper::after { content: ''; position: absolute; inset: 0; background: rgba(167, 166, 128, .34); } /* làm dịu hoạ tiết lá cho ảnh nổi hơn */
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(40, 50, 30, 0) 55%, rgba(40, 50, 30, .22) 100%); }
  .full { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 42%; background: linear-gradient(rgba(20, 24, 16, 0), rgba(20, 24, 16, .55)); }
  .print { position: absolute; box-sizing: border-box; background: var(--paper);
    box-shadow: 0 2px 5px rgba(30, 38, 22, .28), 0 24px 52px -10px rgba(30, 38, 22, .5); }
  .print img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .card { position: absolute; box-shadow: 0 3px 8px rgba(30, 38, 22, .25), 0 30px 70px -12px rgba(30, 38, 22, .55); }
  .card > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .line { position: absolute; left: 0; width: 100%; text-align: center; color: var(--ink); white-space: nowrap; }
  .kicker { font-family: var(--ui); font-weight: 600; text-transform: uppercase; color: var(--ink-2); }
  .name { font-family: var(--script); line-height: 1.2; }
  .amp { font-family: var(--script); color: var(--gold-d); }
  .date { font-family: var(--title); font-weight: 500; }
  .msg { font-family: var(--serif); font-style: italic; color: var(--ink-2); white-space: normal; line-height: 1.5; }
  .cap { position: absolute; text-align: center; color: var(--ink); font-family: var(--script); line-height: 1.15; text-wrap: balance; text-shadow: 0 1px 0 rgba(255, 255, 235, .45); }
  .cap.on-photo { color: #fff; text-shadow: 0 2px 18px rgba(0, 0, 0, .45); }
  .deco { position: absolute; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="mau.js"></script>
</body>
</html>
