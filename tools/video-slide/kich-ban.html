<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Dựng video theo kịch bản</title>
<link rel="stylesheet" href="font/font.css">
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; background: #e4e4e2; transform-origin: 0 0; }
  .shot { position: absolute; inset: 0; overflow: hidden; }
  .inner { position: absolute; inset: 0; overflow: hidden; }
  .blurbg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
  .lift { box-shadow: 0 0 0 1px rgba(255, 250, 240, .08), 0 18px 60px rgba(0, 0, 0, .45), 0 4px 14px rgba(0, 0, 0, .3); }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 75% 70% at 50% 48%, rgba(0, 0, 0, 0) 55%, rgba(12, 10, 6, .32) 100%); }
  .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 38%; background: linear-gradient(rgba(10, 10, 8, 0), rgba(10, 10, 8, .5)); }
  .fx { position: absolute; inset: 0; pointer-events: none; }
  .shot, .inner { perspective: 1800px; }
  .spot { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 75% at 50% 48%, #ffffff 0%, #f6f6f5 40%, #d9d9d7 85%, #c6c6c4 100%); }
  .whitebg { position: absolute; inset: 0; background: #fff; }
  .frame { position: absolute; box-sizing: border-box; background: #fff; transform-origin: 50% 50%;
    box-shadow: 0 14px 38px rgba(0, 0, 0, .30), 0 3px 10px rgba(0, 0, 0, .18); }
  .frame img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .box { position: absolute; overflow: hidden; }
  .box img { position: absolute; left: 0; top: 0; max-width: none; }
  .paper { position: absolute; inset: 0; background-size: cover; }
  .sage { position: absolute; background: #A7A680 url(../../xanh-pastel/assets/giay-xo-tham.webp) 0 0 / 1080px 1920px;
    box-shadow: 3px 0 12px rgba(40, 50, 30, .2), 1px 0 0 rgba(40, 50, 30, .18); }
  .deco { position: absolute; transform-origin: 50% 50%; }
  .txt { position: absolute; white-space: pre; color: #2D3826; line-height: 1.25; }
  .f-script { font-family: 'Ephesis', cursive; font-weight: 400; }
  .f-serif { font-family: 'Lora', serif; font-weight: 400; }
  .f-serif-italic { font-family: 'Lora', serif; font-style: italic; font-weight: 400; }
  .f-ui { font-family: 'Be Vietnam Pro', sans-serif; font-weight: 500; }
  #black { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 9999; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="kich-ban.js"></script>
</body>
</html>
